# .github/workflows/integration-report.yml
#
# Publica o relatório HTML do pytest no GitHub Pages após cada run do CI.
# Acesso: https://steam-ducks.github.io/sca-server/
#
# Pré-requisitos:
#   1. Settings → Pages → Source: GitHub Actions
#   2. Este workflow precisa ter rodado ao menos uma vez com sucesso

name: Integration Report → GitHub Pages

on:
  workflow_run:
    workflows: ["CI - Feature Branch"]   # ← deve ser EXATAMENTE o name: do ci.yml
    types: [completed]

permissions:
  pages: write
  id-token: write

jobs:
  publish-report:
    name: Publish pytest Report
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download pytest report artifact
        uses: actions/download-artifact@v4
        with:
          name: pytest-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: pytest-report

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pytest-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
